<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bridgeway — Interactive Prototype</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --blue: #3267f6;
        --ink: #1e1f23;
        --muted: #5e6169;
        --panel: rgba(248, 244, 236, 0.91);
        --white: rgba(255, 255, 255, 0.93);
        --ui-scale: 1;
        --header-height: clamp(56px, 6.9vh, 110px);
      }

      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
      button, input { font: inherit; }
      button { -webkit-tap-highlight-color: transparent; }

      .viewport {
        position: fixed;
        inset: 0;
        background: transparent;
      }

      .stage {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: #d4e4ec;
      }

      .flowers {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        transition: opacity 240ms ease;
      }

      .stage.entry-mode { background: #fbfaf7; }
      .stage.entry-mode .flowers { opacity: 0; pointer-events: none; }
      .stage.entry-mode .header { background: rgba(251, 250, 247, 0.96); backdrop-filter: none; border-bottom-color: #e7e5e0; }

      .header {
        position: absolute;
        z-index: 5;
        left: 0;
        top: 0;
        width: 100%;
        height: var(--header-height);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 clamp(24px, 3.35vw, 72px);
        background: rgba(236, 244, 247, 0.9);
        backdrop-filter: blur(20px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.8);
      }

      .brand { display: flex; align-items: center; gap: clamp(9px, .65vw, 16px); color: #17191d; font-weight: 700; font-size: clamp(17px, 1.18vw, 30px); }
      .brand-mark { width: clamp(22px, 1.55vw, 38px); height: clamp(22px, 1.55vw, 38px); display: grid; place-items: center; border-radius: 4px; background: #ff1111; color: white; font-size: clamp(13px, .9vw, 23px); font-weight: 800; }
      .concept { border: 0; border-radius: 999px; padding: .35em 1.1em; color: #54575e; background: rgba(247, 246, 241, 0.9); font-size: clamp(12px, .84vw, 21px); }

      .workspace {
        position: absolute;
        inset: var(--header-height) 0 0;
        z-index: 3;
        display: grid;
        place-items: center;
        padding: 26px;
      }

      .stage.entry-mode .workspace {
        display: block;
        padding: 0;
        overflow-x: hidden;
        overflow-y: auto;
        background: #fbfaf7;
      }

      .entry-screen { min-height: 100%; color: var(--ink); background: #fbfaf7; }
      .entry-hero {
        min-height: calc(100vh - var(--header-height));
        display: block;
        padding: clamp(74px, 10vh, 112px) clamp(20px, 3.65vw, 56px) 72px;
      }
      .entry-content { width: min(640px, 100%); margin: 0 auto; text-align: center; }
      .entry-title {
        max-width: 520px;
        margin: 0 auto 26px;
        font-size: clamp(38px, 3.4vw, 52px);
        line-height: 1.02;
        letter-spacing: -0.045em;
      }
      .entry-title em { font-family: Georgia, "Times New Roman", serif; font-weight: 400; }
      .business-form {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        min-height: 74px;
        padding: 8px 10px 8px 23px;
        border: 1px solid #deddd9;
        border-radius: 999px;
        background: white;
        box-shadow: 0 1px 2px rgba(25, 25, 25, .03);
      }
      .business-form:focus-within { border-color: #a8bfff; box-shadow: 0 0 0 3px rgba(50, 103, 246, .12); }
      .business-input { min-width: 0; flex: 1; border: 0; outline: 0; color: #23252a; background: transparent; font-size: 18px; }
      .business-input::placeholder { color: #8a8d93; }
      .business-submit {
        width: 50px;
        height: 50px;
        display: grid;
        place-items: center;
        flex: 0 0 50px;
        border: 0;
        border-radius: 50%;
        color: white;
        background: var(--blue);
        cursor: pointer;
        transition: transform 120ms ease, filter 120ms ease;
      }
      .business-submit:hover { transform: translateX(2px); filter: brightness(1.04); }
      .business-submit svg { width: 27px; height: 27px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .entry-help { margin: 15px 0 0; color: #35373d; font-size: 14px; }
      .entry-error { min-height: 20px; margin: 8px 0 0; color: #ad2525; font-size: 13px; }
      .entry-film {
        width: calc(100vw - clamp(40px, 7.3vw, 112px));
        margin-top: 20px;
        margin-left: 50%;
        padding: 0;
        transform: translateX(-50%);
        background: #fbfaf7;
      }
      .entry-film-inner { width: 100%; margin: 0 auto; }
      .entry-film-frame { aspect-ratio: 16 / 9; overflow: hidden; border-radius: clamp(18px, 2vw, 30px); background: #d9d4cb; box-shadow: 0 25px 55px rgba(34, 31, 26, .15); }
      .entry-film-frame video { width: 100%; height: 100%; display: block; object-fit: cover; }
      .stage.entry-mode .prototype-nav { display: none; }

      .panel {
        width: 560px;
        padding: 38px 40px 39px;
        border-radius: 27px;
        background: var(--panel);
        backdrop-filter: blur(18px) saturate(0.95);
        border: 1px solid rgba(255, 255, 255, 0.74);
        box-shadow: 0 20px 55px rgba(55, 42, 24, 0.16);
        transform: scale(var(--ui-scale));
        transform-origin: center;
      }
      .panel.wide { width: 720px; }
      .panel.complete { width: 640px; text-align: center; padding: 44px 40px 38px; }

      .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 24px; margin-bottom: 12px; }
      .step { color: var(--blue); font-size: 12px; line-height: 1; font-weight: 700; letter-spacing: 0.05em; }
      .progress { display: grid; grid-template-columns: repeat(5, 38px); gap: 3px; }
      .progress span { height: 4px; border-radius: 4px; background: white; }
      .progress span.on { background: var(--blue); }

      h1 { margin: 0; color: var(--ink); font-size: 27px; line-height: 1.18; letter-spacing: -0.025em; }
      .subhead { margin: 7px 0 27px; color: #303239; font-size: 14px; line-height: 1.42; }
      .eyebrow { color: #5c6068; font-size: 11px; font-weight: 750; letter-spacing: 0.03em; text-transform: uppercase; }

      .choices { display: grid; gap: 10px; }
      .choice {
        width: 100%; min-height: 50px; display: flex; align-items: center; gap: 12px;
        padding: 11px 15px; border: 1.5px solid #dedede; border-radius: 16px;
        color: #3b3e45; background: var(--white); text-align: left; cursor: pointer;
        transition: border-color 120ms ease, box-shadow 120ms ease, transform 120ms ease;
      }
      .choice:hover { transform: translateY(-1px); border-color: #9cb6ff; }
      .choice.selected { border-color: var(--blue); color: #17346d; box-shadow: 0 0 0 1px var(--blue) inset; }
      .choice-indicator { width: 18px; height: 18px; flex: 0 0 18px; display: grid; place-items: center; border-radius: 50%; border: 1.5px solid #c8cbd1; background: white; }
      .choice.selected .choice-indicator { border-color: var(--blue); background: var(--blue); }
      .choice.selected .choice-indicator::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: white; }
      .choice.multi .choice-indicator { border-radius: 4px; }
      .choice.multi.selected .choice-indicator::after { content: "✓"; width: auto; height: auto; color: white; background: transparent; font-size: 12px; line-height: 1; font-weight: 800; }

      .cta {
        width: 100%; min-height: 52px; margin-top: 30px; border: 0; border-radius: 999px;
        color: white; background: var(--blue); font-weight: 650; cursor: pointer;
        box-shadow: 0 8px 20px rgba(50, 103, 246, 0.19);
        transition: transform 120ms ease, filter 120ms ease;
      }
      .cta:hover { transform: translateY(-1px); filter: brightness(1.04); }
      .cta:active { transform: translateY(1px); }
      .text-button { display: block; margin: 15px auto 0; border: 0; color: #565a61; background: transparent; cursor: pointer; font-size: 13px; }

      .slider-card { padding: 21px 20px 19px; border-radius: 18px; background: var(--white); border: 1px solid #e0e0e0; }
      .slider-row + .slider-row { margin-top: 18px; }
      .slider-label { display: block; margin: 0 0 10px; color: #26282e; font-size: 14px; font-weight: 560; }
      input[type="range"] { width: 100%; accent-color: var(--blue); cursor: pointer; }
      .range-labels { display: flex; justify-content: space-between; margin-top: 7px; color: #5b5e65; font-size: 12px; }
      .summary { margin: 20px 0 0; padding: 9px 0 9px 14px; border-left: 3px solid var(--blue); color: #33363c; font-size: 13px; line-height: 1.45; }

      .sources { display: grid; gap: 11px; }
      .source-row { min-height: 72px; display: flex; align-items: center; gap: 13px; padding: 12px 16px; border-radius: 16px; background: var(--white); border: 1px solid #e1e1e1; }
      .source-icon { width: 44px; height: 44px; display: grid; place-items: center; flex: 0 0 44px; border-radius: 50%; background: #f0f0ef; color: #111318; }
      .source-icon svg { width: 25px; height: 25px; display: block; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .source-copy { flex: 1; }
      .source-title { color: #26292f; font-size: 14px; font-weight: 650; }
      .source-meta { margin-top: 2px; color: #73767d; font-size: 11px; }
      .connect { min-width: 106px; border: 1.5px solid var(--blue); border-radius: 999px; padding: 8px 15px; color: var(--blue); background: white; cursor: pointer; font-size: 12px; font-weight: 700; }
      .connect.on { color: white; background: var(--blue); box-shadow: 0 6px 14px rgba(50, 103, 246, .2); }
      .connect.on::before { content: "✓ "; }
      .safety { display: flex; align-items: center; gap: 10px; margin-top: 16px; padding: 12px; border: 1px solid white; border-radius: 12px; background: rgba(255,255,255,0.55); color: #686b72; font-size: 12px; }

      .done-icon { width: 100px; height: 100px; display: grid; place-items: center; margin: 0 auto 36px; border-radius: 50%; background: rgba(50,103,246,0.12); box-shadow: inset 0 0 0 10px rgba(50,103,246,0.10); }
      .done-icon span { width: 60px; height: 60px; display: grid; place-items: center; border-radius: 50%; background: var(--blue); color: white; font-size: 30px; }
      .complete h1 { font-size: 34px; }
      .complete .subhead { max-width: 560px; margin: 12px auto 30px; color: #686b72; }
      .result-list { padding: 12px 23px; border-radius: 18px; background: var(--white); border: 1px solid #dfdfdf; text-align: left; }
      .result { display: flex; gap: 12px; align-items: flex-start; padding: 14px 0; }
      .result + .result { border-top: 1px solid #e2e2e2; }
      .check { width: 20px; height: 20px; display: grid; place-items: center; flex: 0 0 20px; border-radius: 50%; background: var(--blue); color: white; font-size: 11px; font-weight: 800; }
      .result strong { display: block; color: #292b31; font-size: 14px; }
      .result small { display: block; margin-top: 2px; color: #74777e; font-size: 11px; }

      .prototype-nav { position: absolute; z-index: 7; left: 18px; bottom: 17px; display: flex; gap: 8px; }
      .prototype-nav button { border: 1px solid rgba(255,255,255,0.78); border-radius: 999px; padding: 7px 12px; color: #22252a; background: rgba(255,255,255,0.76); backdrop-filter: blur(12px); cursor: pointer; font-size: 12px; }
      .prototype-nav button:disabled { opacity: 0.45; cursor: default; }

      @media (prefers-reduced-motion: reduce) {
        .choice, .cta { transition: none; }
      }

      @media (max-width: 720px) {
        .entry-hero { padding-top: 64px; }
        .business-form { min-height: 64px; padding-left: 18px; }
        .business-submit { width: 46px; height: 46px; flex-basis: 46px; }
      }
    </style>
  </head>
  <body>
    <div class="viewport">
      <div class="stage" id="stage">
        <video id="flowers" class="flowers" src="/assets/try-yourself-flowers.mp4" autoplay muted loop playsinline preload="auto"></video>
        <header class="header">
          <div class="brand"><span class="brand-mark">A</span><span>Bridgeway</span></div>
          <span class="concept">CONCEPT</span>
        </header>
        <main class="workspace" id="workspace" aria-live="polite"></main>
        <nav class="prototype-nav" aria-label="Prototype navigation">
          <button id="backButton" type="button">← Back</button>
          <button id="restartButton" type="button">Restart</button>
        </nav>
      </div>
    </div>

    <script>
      const screens = [
        {
          kind: "radio", step: 1, title: "Which beginning sounds most like you?", subtitle: "",
          options: ["I built what I wished existed.", "I wanted people to feel they belong.", "I saw a better way and couldn’t let it go.", "I wanted to make a hard thing feel more human."],
          selected: 1, cta: "Use this beginning →"
        },
        { kind: "sliders", step: 2, title: "Shape how your story shows up.", subtitle: "Move each control until the direction feels true to your business.", cta: "Keep shaping my story →" },
        {
          kind: "multi", step: 3, title: "What should people feel?", subtitle: "Select the emotional outcome of your stories.",
          options: ["Deep Trust & Craft", "Immediate Wonder", "Energy & Action", "Quiet Authenticity", "Intellectual Curiosity"], selected: [0, 3], cta: "Set the feeling →"
        },
        {
          kind: "multi", step: 4, title: "What should stay with people?", subtitle: "Choose the one thought you’d love them to carry away.",
          options: ["They really understand me", "I felt welcome here", "That was easier than I expected", "I want to come back", "I want to tell everyone about it"], selected: [0, 3], cta: "Set what stays →"
        },
        { kind: "sources", step: 5, title: "Where does your story already live?", subtitle: "Connect a source and Bridgeway can learn your voice, visual language, and what people respond to.", cta: "Build my starting strategy →" },
        { kind: "complete" }
      ];

      let screenIndex = 0;
      let entryComplete = false;
      let businessName = "";
      const answers = {};
      const workspace = document.getElementById("workspace");
      const backButton = document.getElementById("backButton");
      const flowers = document.getElementById("flowers");
      const stage = document.getElementById("stage");
      const concept = document.querySelector(".concept");
      const instagramIcon = `<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4.2"></circle><circle cx="17.4" cy="6.7" r="1" fill="currentColor" stroke="none"></circle></svg>`;
      const websiteIcon = `<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c3 3 4.2 6 4.2 9S15 18 12 21M12 3C9 6 7.8 9 7.8 12S9 18 12 21"></path></svg>`;

      function progress(step) {
        return `<div class="progress" aria-label="Step ${step} of 5">${[1,2,3,4,5].map(n => `<span class="${n <= step ? "on" : ""}"></span>`).join("")}</div>`;
      }

      function shell(screen, body, extraClass = "") {
        return `<section class="panel ${extraClass}">
          <div class="panel-head"><span class="step">${screen.step} OF 5</span>${progress(screen.step)}</div>
          <h1>${screen.title}</h1>
          ${screen.subtitle ? `<p class="subhead">${screen.subtitle}</p>` : `<div style="height:24px"></div>`}
          ${body}
        </section>`;
      }

      function choicesMarkup(screen, multi = false) {
        const selected = answers[screenIndex] ?? screen.selected;
        return `<div class="choices">${screen.options.map((text, i) => {
          const on = multi ? selected.includes(i) : selected === i;
          return `<button class="choice ${multi ? "multi" : ""} ${on ? "selected" : ""}" type="button" data-choice="${i}" aria-pressed="${on}"><span class="choice-indicator"></span><span>${text}</span></button>`;
        }).join("")}</div><button class="cta" type="button" data-next>${screen.cta}</button>`;
      }

      function normalizedBusinessName(value) {
        return String(value ?? "").trim();
      }

      function render() {
        stage.classList.toggle("entry-mode", !entryComplete);
        concept.textContent = businessName || "CONCEPT";

        if (!entryComplete) {
          backButton.disabled = true;
          flowers.pause();
          workspace.innerHTML = `<section class="entry-screen">
            <div class="entry-hero">
              <div class="entry-content">
                <h1 class="entry-title">Marketing for small<br>businesses <em>made easy.</em></h1>
                <form class="business-form" id="businessNameForm" novalidate>
                  <label for="businessName" class="sr-only" style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0">Business name</label>
                  <input class="business-input" id="businessName" name="businessName" type="text" autocomplete="organization" placeholder="Unbound Fitness" aria-describedby="businessHelp businessError" autofocus>
                  <button class="business-submit" type="submit" aria-label="Start onboarding">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
                  </button>
                </form>
                <p class="entry-help" id="businessHelp">Use the name customers know you by and we’ll confirm the match.</p>
                <p class="entry-error" id="businessError" role="alert"></p>
              </div>
              <div class="entry-film" aria-label="See Bridgeway in motion">
                <div class="entry-film-inner">
                  <div class="entry-film-frame"><video id="advertisementVideo" src="/assets/try-yourself-advertisement.mp4" autoplay muted loop playsinline preload="auto" aria-label="Bridgeway advertisement"></video></div>
                </div>
              </div>
            </div>
          </section>`;
          workspace.querySelector("#advertisementVideo")?.play().catch(() => {});
          return;
        }

        flowers.play().catch(() => {});
        const screen = screens[screenIndex];
        backButton.disabled = false;

        if (screen.kind === "radio") {
          workspace.innerHTML = shell(screen, choicesMarkup(screen));
        } else if (screen.kind === "multi") {
          if (!answers[screenIndex]) answers[screenIndex] = [...screen.selected];
          workspace.innerHTML = shell(screen, choicesMarkup(screen, true));
        } else if (screen.kind === "sliders") {
          workspace.innerHTML = shell(screen, `
            <div class="slider-card">
              <div class="eyebrow" style="margin-bottom:20px">Make it yours</div>
              <label class="slider-row"><span class="slider-label">How should you sound?</span><input data-slider="tone" type="range" min="0" max="100" value="76"><span class="range-labels"><span>Familiar</span><span>Bold</span></span></label>
              <label class="slider-row"><span class="slider-label">What should lead the story?</span><input data-slider="lead" type="range" min="0" max="100" value="30"><span class="range-labels"><span>People</span><span>Product</span></span></label>
              <label class="slider-row"><span class="slider-label">What matters most right now?</span><input data-slider="goal" type="range" min="0" max="100" value="84"><span class="range-labels"><span>Build trust</span><span>Reach new people</span></span></label>
            </div>
            <p class="summary">Your tone will lean <strong>Bold</strong> to tell an authentic story centered on <strong>People</strong> to help you <strong>Reach new people.</strong></p>
            <button class="cta" type="button" data-next>${screen.cta}</button>
          `, "wide");
        } else if (screen.kind === "sources") {
          const connected = answers.sources ?? [false, true];
          workspace.innerHTML = shell(screen, `
            <div class="sources">
              <div class="source-row"><span class="source-icon">${instagramIcon}</span><div class="source-copy"><div class="source-title">Instagram</div><div class="source-meta">@bridgewaybloom</div></div><button class="connect ${connected[0] ? "on" : ""}" data-source="0" aria-pressed="${connected[0]}">${connected[0] ? "Connected" : "Connect"}</button></div>
              <div class="source-row"><span class="source-icon">${websiteIcon}</span><div class="source-copy"><div class="source-title">Website</div><div class="source-meta">bridgewaybloom.com</div></div><button class="connect ${connected[1] ? "on" : ""}" data-source="1" aria-pressed="${connected[1]}">${connected[1] ? "Connected" : "Connect"}</button></div>
            </div>
            <div class="safety"><span style="color:var(--blue);font-size:20px">♢</span><span>Nothing is posted or changed without your approval.</span></div>
            <button class="cta" type="button" data-next>${screen.cta}</button>
            <button class="text-button" type="button" data-next>Not now</button>
          `, "wide");
        } else {
          workspace.innerHTML = `<section class="panel complete">
            <div class="done-icon"><span>✓</span></div>
            <h1>You’re all set.</h1>
            <p class="subhead">Bridgeway understands what started your business, how you want to sound, and what you want people to remember.</p>
            <div class="result-list">
              <div class="result"><span class="check">✓</span><div><strong>Your story is shaped</strong><small>The beginning behind your business is ready to guide the work.</small></div></div>
              <div class="result"><span class="check">✓</span><div><strong>Your marketing direction is ready</strong><small>Your voice, focus, and immediate goal are saved.</small></div></div>
              <div class="result"><span class="check">✓</span><div><strong>Instagram and website connected</strong><small>Bridgeway will sync with your digital touchpoints.</small></div></div>
            </div>
            <button class="cta" type="button" data-restart>Replay prototype →</button>
            <button class="text-button" type="button" data-back>Review my answers</button>
          </section>`;
        }
      }

      workspace.addEventListener("submit", event => {
        if (event.target.id !== "businessNameForm") return;
        event.preventDefault();
        const input = event.target.elements.businessName;
        const error = document.getElementById("businessError");
        const name = normalizedBusinessName(input.value);
        if (!name) {
          input.setAttribute("aria-invalid", "true");
          error.textContent = "Enter your business name to continue.";
          input.focus();
          return;
        }
        businessName = name;
        entryComplete = true;
        screenIndex = 0;
        render();
      });

      workspace.addEventListener("click", event => {
        const choice = event.target.closest("[data-choice]");
        if (choice) {
          const screen = screens[screenIndex];
          const index = Number(choice.dataset.choice);
          if (screen.kind === "multi") {
            const selected = answers[screenIndex] ?? [...screen.selected];
            answers[screenIndex] = selected.includes(index) ? selected.filter(i => i !== index) : [...selected, index];
          } else {
            answers[screenIndex] = index;
          }
          render();
          return;
        }

        const source = event.target.closest("[data-source]");
        if (source) {
          const selected = answers.sources ?? [false, true];
          const index = Number(source.dataset.source);
          selected[index] = !selected[index];
          answers.sources = selected;
          render();
          return;
        }

        if (event.target.closest("[data-next]")) {
          screenIndex = Math.min(screens.length - 1, screenIndex + 1);
          render();
        } else if (event.target.closest("[data-restart]")) {
          screenIndex = 0;
          businessName = "";
          entryComplete = false;
          render();
        } else if (event.target.closest("[data-back]")) {
          screenIndex = Math.max(0, screenIndex - 1);
          render();
        }
      });

      backButton.addEventListener("click", () => {
        if (screenIndex === 0) entryComplete = false;
        else screenIndex -= 1;
        render();
      });
      document.getElementById("restartButton").addEventListener("click", () => {
        screenIndex = 0;
        businessName = "";
        entryComplete = false;
        render();
      });

      function fitInterface() {
        const scale = Math.min(window.innerWidth / 1440, window.innerHeight / 900);
        document.documentElement.style.setProperty("--ui-scale", String(scale));
      }
      window.addEventListener("resize", fitInterface);
      fitInterface();
      render();
      flowers.play().catch(() => {});
    </script>
  </body>
</html>
